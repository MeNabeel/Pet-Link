name: PetLink CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  # Job 1: Code Quality & Linting
  lint:
    name: Code Linting Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            server/backend/package.json
            client/web/package.json
            client/app/package.json

      # Backend Linting
      - name: Install Backend Dependencies
        run: npm install --no-audit --no-fund --prefix server/backend

      - name: Lint Backend Codebase
        run: npm run lint --prefix server/backend

      # Web Client Linting
      - name: Install Web Client Dependencies
        run: npm install --no-audit --no-fund --prefix client/web

      - name: Lint Web Client Codebase
        run: npm run lint --prefix client/web

      # Mobile App Client Linting
      - name: Install Mobile App Dependencies
        run: npm install --no-audit --no-fund --prefix client/app

      - name: Lint Mobile Client Codebase
        run: npm run lint --prefix client/app

  # Job 2: Running Unit Tests & Generating Coverage Reports
  test:
    name: Unit Tests & Code Coverage
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            server/backend/package.json
            client/web/package.json
            client/app/package.json

      # Backend Tests & Coverage
      - name: Install Backend Dependencies
        run: npm install --no-audit --no-fund --prefix server/backend

      - name: Run Backend Tests
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: npm run test --prefix server/backend -- --coverage

      # Web Client Tests
      - name: Install Web Client Dependencies
        run: npm install --no-audit --no-fund --prefix client/web

      - name: Run Web Client Tests
        run: npm run test --prefix client/web

      # Mobile App Client Tests
      - name: Install Mobile App Dependencies
        run: npm install --no-audit --no-fund --prefix client/app

      - name: Run Mobile App Tests
        run: npm run test --prefix client/app

  # Job 3: Production Build Validation
  build:
    name: Production Bundles Verification
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            server/backend/package.json
            client/web/package.json
            client/app/package.json

      # Compile Web Client Build
      - name: Install Web Client Dependencies
        run: npm install --no-audit --no-fund --prefix client/web

      - name: Build Web Client Production Bundle
        run: npm run build --prefix client/web

      # Compile Mobile Client Build (Expo Export)
      - name: Install Mobile App Dependencies
        run: npm install --no-audit --no-fund --prefix client/app

      - name: Build Mobile Client Bundle
        run: npm run build --prefix client/app
